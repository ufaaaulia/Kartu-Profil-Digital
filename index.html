<!DOCTYPE html>
<html lang="id">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Digital Profile Card</title>
	<link rel="stylesheet" href="style.css">
</head>
<body>

	<!-- Kartu Kontainer Utama -->
	<div class="profile-card">

		<!-- Badge Status Aktif -->
		<span class="badge"> Ready to Code</span>

		<!-- Foto Profil -->
		<img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQbQWeWZWzfRSgkTEuueH3VzspBULr_vW3AZPGt34CzHQ&s=10"
alt="Foto Profil" class="profile-img">

		<!-- Nama & Peran -->
		<h1> Arif Putra</h1>
		<p class="role">UI/UX Designer & Student RPL</p>

		<p class="bio">Suka bikin tampilan web yg estetik, hobi ngegambar.</p>
		

		<div class="social-links">
			<a href="#" class="btn github">Github</a>
			<a href="#" class="btn instagram">Instagram</a>
		</div>

	</div>
</body>
</html>
